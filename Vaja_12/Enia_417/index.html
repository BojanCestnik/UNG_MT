<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <meta name="description" content="Notebook — your simple study planner.">
  <title>Notebook — Study Planner</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <a class="brand" href="#" aria-label="Notebook home">
        <span class="brand-icon" aria-hidden="true">▤</span>
        <span><strong>Notebook</strong><small>STUDY PLANNER</small></span>
      </a>
      <div class="hero-message">
        <span>Plan.</span> Study. Achieve.
        <small>Your goals, one task at a time.</small>
      </div>
      <div class="hero-decoration" aria-hidden="true">
        <span class="book book-back"></span><span class="book book-mid"></span><span class="book book-front"></span>
        <span class="sparkle">✦</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel add-panel" aria-labelledby="form-heading">
      <div class="panel-title"><span class="plus-icon">＋</span><h1 id="form-heading">Add New Task</h1></div>
      <form id="task-form">
        <div class="form-grid">
          <div class="field title-field">
            <label for="task-title">Task Title</label>
            <input id="task-title" name="title" type="text" maxlength="100" placeholder="e.g. Linear Algebra Exam" required>
          </div>
          <div class="field">
            <label for="task-subject">Subject</label>
            <input id="task-subject" name="subject" type="text" maxlength="50" placeholder="e.g. Mathematics" required>
          </div>
          <div class="field">
            <label for="task-type">Type</label>
            <select id="task-type" name="type">
              <option value="Exam">Exam</option>
              <option value="Assignment">Assignment</option>
              <option value="Project">Project</option>
            </select>
          </div>
          <div class="field">
            <label for="task-date">Due Date</label>
            <input id="task-date" name="dueDate" type="date" required>
          </div>
          <button class="add-button" type="submit"><span>＋</span> Add Task</button>
        </div>
      </form>
    </section>

    <section class="tasks-section" aria-labelledby="tasks-heading">
      <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter-button selected" type="button" data-filter="all" aria-pressed="true">▦ &nbsp; All <span id="all-count">0</span></button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">▶ &nbsp; Active <span id="active-count">0</span></button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">✓ &nbsp; Completed <span id="completed-count">0</span></button>
        </div>
        <label class="sort-control">↕ <span>Sort by: Due Date</span></label>
      </div>
      <div class="task-list" id="task-list" aria-live="polite"></div>
    </section>

    <footer>
      <div class="footer-summary"><span class="info-icon">i</span><span id="summary-text">You have 0 active tasks and 0 completed tasks.</span></div>
      <div class="footer-cheer">🏆 &nbsp; Keep going! You're doing great! ✨</div>
    </footer>
  </main>
  <script src="./src/script.js"></script>
</body>
</html>
