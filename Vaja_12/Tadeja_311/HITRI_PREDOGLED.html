<style>

lue{background:#E1F2FF;color:#527F9E}.pill.pink{background:#FFE8F0;color:#B16C85}.pill.green{background:#E4F5EB;color:#52866A}.pill.gold{background:#FFF2E4;color:#AA854C}.progress{height:10px;border-radius:999px;background:#EEEAFB;overflow:hidden}.progress>div{height:100%;background:#6D5CE7;border-radius:999px}.circle{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.circle>div{width:87px;height:87px;background:white;border-radius:50%;display:grid;place-content:center;text-align:center;font-size:26px;font-weight:850}.circle small{display:block;font-size:10px;font-weight:500;color:#847B93}.listitem{border:1px solid #F0EDF8;padding:15px;border-radius:16px;margin-bottom:10px}.listitem h3{margin:0 0 6px;font-size:15px}.listitem p{font-size:13px;color:#797489;line-height:1.45;margin:6px 0}.flex{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{display:grid;gap:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:0;border-radius:11px;background:#F1EDFA;color:#746D8E;font-size:13px;padding:11px 13px;min-height:42px;font-weight:700}.tabs button.active{background:#6D5CE7;color:white}.smallbutton{border:0;background:transparent;color:#6D5CE7;font-size:12px;font-weight:800;padding:10px;border-radius:9px;min-height:40px}.smallbutton:hover{background:#F4F0FF}.smallbutton.danger{color:#B05771}.rowactions{display:flex;justify-content:flex-end;border-top:1px solid #F2EEF8;padding-top:7px;margin-top:10px}.empty{text-align:center;padding:40px 15px;background:#FBFAFF;border-radius:16px;color:#787088;font-size:14px}.empty div{font-size:35px;margin-bottom:10px}.calendar-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}.calendar-head strong{font-size:18px;text-transform:capitalize}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#918AA1;font-weight:800;font-size:11px;padding:10px 0}.day{min-width:0;min-height:89px;border:1px solid #F0ECF7;border-radius:11px;background:#fff;padding:8px;text-align:left;display:flex;flex-direction:column;gap:7px}.day:hover{background:#F9F6FF}.day.selected{border-color:#B3A4FA;background:#F0EBFF}.day.outside{opacity:.48}.day b{font-size:12px}.day.today b{color:white;background:#6D5CE7;padding:5px 7px;border-radius:100px}.dots{display:flex;flex-wrap:wrap;gap:4px}.dot{height:8px;width:8px;border-radius:50%;background:#AA9AE7}.dot.blue{background:#8BC8EC}.dot.pink{background:#F2A6C0}.dot.green{background:#88D0AF}.dot.gold{background:#EAC68D}.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekdays .day{min-height:142px}.modalwrap{position:fixed;inset:0;background:rgba(36,32,56,.5);z-index:50;display:grid;place-items:center;padding:18px;overflow:auto}.modal{background:white;width:min(470px,100%);max-height:90vh;overflow-y:auto;padding:24px;border-radius:24px}.modal h2{font-size:23px;margin:0 0 21px}.form{display:grid;gap:14px}.form label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.form input:not([type=checkbox]),.form textarea,.form select,.select{width:100%;padding:11px 12px;border:1px solid #E4DFED;border-radius:12px;min-height:45px;background:white;color:#25243A;outline:none}.form textarea{min-height:90px;resize:vertical}.form input[type=checkbox]{width:21px;height:21px;accent-color:#6D5CE7}.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bars{display:flex;align-items:end;justify-content:space-between;gap:10px;height:190px;margin-top:18px}.bars>div{display:flex;flex:1;min-width:0;align-items:center;flex-direction:column;justify-content:end;height:100%;gap:6px;font-size:11px;color:#8A8398}.bar{background:#EAE4FA;border-radius:8px 8px 0 0;width:min(39px,100%);min-height:4px;display:flex;align-items:end;overflow:hidden}.bar i{width:100%;background:#6D5CE7;display:block}.setting{display:flex;gap:12px;justify-content:space-between;align-items:center;background:#F9F7FF;border-radius:14px;padding:16px}.setting input{width:22px;height:22px;accent-color:#6D5CE7}.notice{position:fixed;right:18px;bottom:18px;z-index:70;background:white;box-shadow:0 5px 24px #6356a344;padding:18px;border:1px solid #DBD1FF;border-radius:18px;max-width:340px;display:flex;gap:10px}.notice button{border:0;background:transparent;cursor:pointer}@media(max-width:1000px){aside{width:198px}main{padding:28px}.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:690px){#app{display:block}aside{position:relative;width:100%;height:auto;padding:14px 14px;border-right:0;border-bottom:1px solid #E9E5F3}.logo{margin:2px 0 12px}.nav{grid-template-columns:repeat(3,1fr);gap:5px}.nav button{text-align:center;font-size:11px;padding:9px 3px}.sidebar-note{display:none}main{padding:22px 16px}header{display:block;margin-bottom:22px}header h1{font-size:28px}header .date{display:inline-block;margin-top:13px}.hero{padding:22px}.hero h2{font-size:23px}.weekdays .day{min-height:100px;padding:5px}.day{min-height:69px;padding:5px}.stat strong{font-size:27px}.panel{padding:18px}.form .two{grid-template-columns:1fr}.taskrow{flex-wrap:wrap}.taskrow .pill{margin-left:29px}}

</head><body><div id="app"></div><div id="dialog"></div><div id="alerts"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), names=['Domov','Moje naloge','Koledar','Moji cilji','Statistika','Nastavitve'], navKeys=['home','tasks','calendar','goals','stats','settings'], navIcons=['⌂','☑','▦','◎','▥','⚙'], cats=['Študij','Delo','Osebno','Zdravje','Drugo'];
const key='moj-ritem-demo-v1';
const dateStr=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateObj=s=>new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)));
const offset=(s,n)=>{const d=dateObj(s);d.setDate(d.getDate()+n);return dateStr(d)};
const monOffset=(s,n)=>{const d=dateObj(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return dateStr(d)};
const weekStart=s=>offset(s,-((dateObj(s).getDay()+6)%7));
const nice=(d,opts={day:'numeric',month:'short',year:'numeric'})=>new Intl.DateTimeFormat('sl-SI',opts).format(dateObj(d));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const pct=(a,b)=>b?Math.round(100*a/b):0;
const styleCat=c=>({'Študij':'','Delo':'blue','Osebno':'pink','Zdravje':'green','Drugo':'gold'}[c]||'');
const timeValue=(d,t)=>new Date(d+'T'+(t||'23:59')+':00').getTime();
const seed=()=>{const t=dateStr();return {tasks:[
{id:'t1',title:'Pripravi zapiske za predavanje',description:'Ponovi pomembne pojme.',date:t,time:'10:00',category:'Študij',important:true,completed:true},
{id:'t2',title:'Sprehod na svežem zraku',description:'Vzemi si pol ure zase.',date:t,time:'17:30',category:'Zdravje',important:false,completed:false},
{id:'t3',title:'Preberi 20 strani knjige',description:'',date:t,time:'20:00',category:'Osebno',important:false,completed:false},
{id:'t4',title:'Dokončaj seminarsko nalogo',description:'',date:offset(t,1),time:'14:00',category:'Študij',important:true,completed:false}],
events:[{id:'e1',title:'Predavanje',date:t,time:'09:00',category:'Študij',reminderMinutesBefore:null},{id:'e2',title:'Kava s prijateljico',date:offset(t,1),time:'16:00',category:'Osebno',reminderMinutesBefore:30},{id:'e3',title:'Vadba joge',date:offset(t,3),time:'18:00',category:'Zdravje',reminderMinutesBefore:15}],
goals:[{id:'g1',title:'Popij 8 kozarcev vode',period:'daily',deadline:t,target:8,progress:5,completed:false},{id:'g2',title:'Trikrat pojdi na sprehod',period:'weekly',deadline:offset(t,6),target:3,progress:1,completed:false},{id:'g3',title:'Preberi eno knjigo',period:'monthly',deadline:offset(t,25),target:20,progress:12,completed:false}],
settings:{remindersEnabled:true,defaultReminderMinutes:15}}};
let data;try{const x=JSON.parse(localStorage.getItem(key));data=x&&Array.isArray(x.tasks)&&Array.isArray(x.events)&&Array.isArray(x.goals)&&x.settings&&typeof x.settings.remindersEnabled==='boolean'?x:seed()}catch{data=seed()}
const state={page:'home',filter:'all',category:'all',goalFilter:'all',calMode:'month',cursor:dateStr(),chosen:dateStr(),showAll:false,dialog:null,alert:null};
let noticed=new Set();function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}}
function changePage(page){state.page=page;state.dialog=null;render()}
const link=(page,text)=>`<a role="button" tabindex="0" data-page="${page}">${esc(text)}</a>`;
const pill=c=>`<span class="pill ${styleCat(c)}">${esc(c)}</span>`;
const progress=v=>`<div class="progress"><div style="width:${Math.min(100,Math.max(0,v))}%"></div></div>`;
const stat=(icon,value,label)=>`<div class="panel stat"><i>${icon}</i><strong>${value}</strong><span>${label}</span></div>`;
function dashboard(){const t=dateStr(),today=data.tasks.filter(x=>x.date===t),done=today.filter(x=>x.completed).length,finished=data.goals.filter(x=>x.completed).length,soon=data.events.filter(x=>timeValue(x.date,x.time)>=Date.now()).sort((a,b)=>timeValue(a.date,a.time)-timeValue(b.date,b.time));const p=pct(done,today.length);
return `<div class="stack"><div class="hero"><div><div class="eyebrow">Tvoj prostor za ravnovesje</div><h2>Počasi, z občutkom.<br>Danes zmoreš veliko. 🌷</h2><p>Ni treba narediti vsega naenkrat. Začni z eno stvarjo.</p><button class="btn" data-page="tasks">Oglej si naloge ↗</button></div><div style="font-size:75px;opacity:.8" aria-hidden="true">✿</div></div><div class="grid4">${stat('☷',today.length,'Današnje naloge')}${stat('✓',done,'Že opravljene')}${stat('▦',soon.length,'Prihodnji dogodki')}${stat('◎',finished+'/'+data.goals.length,'Doseženi cilji')}</div><div class="grid2"><div class="stack"><section class="panel"><div class="section-header"><h2>Današnje naloge</h2>${link('tasks','Vse naloge →')}</div>${today.length?today.map(x=>`<div class="taskrow"><label><input type="checkbox" data-check="${esc(x.id)}" ${x.completed?'checked':''}><span class="title ${x.completed?'muted':''}">${esc(x.title)}</span></label><span class="sub">${esc(x.time)}</span>${pill(x.category)}</div>`).join(''):'<div class="empty"><div>🌼</div>Danes je tvoj prost dan.</div>'}</section><section class="panel"><div class="section-header"><h2>Tvoji cilji</h2>${link('goals','Poglej vse →')}</div>${data.goals.length?data.goals.slice(0,3).map(x=>`<div style="margin:0 0 17px"><div class="flex between" style="font-size:13px;margin-bottom:8px"><b>${esc(x.title)}</b><b>${pct(x.progress,x.target)}%</b></div>${progress(pct(x.progress,x.target))}</div>`).join(''):'<p class="sub">Dodaj svoj prvi cilj.</p>'}</section></div><div class="stack"><section class="panel"><div class="section-header"><h2>Današnji napredek</h2><span>✨</span></div><div class="flex"><div class="circle" style="background:conic-gradient(#6D5CE7 ${p}%,#EEEAFB ${p}% 100%)"><div>${p}%<small>opravljeno</small></div></div><p class="sub"><b style="color:#25243A">Lepo ti gre!</b><br>${done} od ${today.length} današnjih nalog je opravljenih.</p></div></section><section class="panel"><div class="section-header"><h2>Prihajajoči dogodki</h2>${link('calendar','Koledar →')}</div>${soon.length?soon.slice(0,4).map(x=>`<div class="taskrow"><div class="dot ${styleCat(x.category)}" style="flex-shrink:0"></div><div style="flex:1"><b style="font-size:14px">${esc(x.title)}</b><div class="sub">${nice(x.date,{day:'numeric',month:'short'})} · ${x.time}</div></div>${pill(x.category)}</div>`).join(''):'<div class="empty"><div>🌿</div>Ni prihodnjih dogodkov.</div>'}</section><div class="panel" style="background:#EAF4FF"><b>💌 Misel za lepši dan</b><p class="sub">Napredek ni vedno hiter. Pomembno je, da greš v svojo smer.</p></div></div></div></div>`}
function tasks(){let values=data.tasks.filter(x=>state.category==='all'||x.category===state.category).filter(x=>state.filter==='all'||(state.filter==='today'&&x.date===dateStr())||(state.filter==='upcoming'&&!x.completed&&x.date>=dateStr())||(state.filter==='done'&&x.completed)||(state.filter==='overdue'&&!x.completed&&timeValue(x.date,x.time)<Date.now())).sort((a,b)=>Number(a.completed)-Number(b.completed)||(a.date+a.time).localeCompare(b.date+b.time));
return `<div class="stack"><div class="hero"><div><h2>Vsaka kljukica je majhna zmaga! ✨</h2><p>${data.tasks.filter(x=>x.completed).length} od ${data.tasks.length} nalog je že opravljenih.</p></div><button class="btn" data-add="task">＋ Dodaj nalogo</button></div><section class="panel"><div class="section-header"><div><h2>Seznam nalog</h2><p class="sub">${values.length} prikazanih nalog</p></div><select class="select" id="categoryFilter" style="width:auto;max-width:170px"><option value="all">Vse kategorije</option>${cats.map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="tabs" style="margin-bottom:20px">${[['all','Vse'],['today','Danes'],['upcoming','Prihajajoče'],['done','Opravljene'],['overdue','Zamujene']].map(([id,label])=>`<button data-filter="${id}" class="${state.filter===id?'active':''}">${label}</button>`).join('')}</div>${values.length?values.map(x=>`<div class="listitem"><div class="taskrow" style="border:0;padding:0;margin:0"><label><input data-check="${esc(x.id)}" type="checkbox" ${x.completed?'checked':''}><span class="title ${x.completed?'muted':''}">${esc(x.title)} ${x.important?'⭐':''}</span></label></div>${x.description?`<p>${esc(x.description)}</p>`:''}<div class="flex wrap" style="margin-top:12px">${pill(x.category)}<span class="sub">🗓 ${nice(x.date)} ob ${esc(x.time)}</span>${!x.completed&&timeValue(x.date,x.time)<Date.now()?'<span class="pill pink">Zamujeno</span>':''}</div><div class="rowactions"><button class="smallbutton" data-edit="task" data-id="${esc(x.id)}">✎ Uredi</button><button class="smallbutton danger" data-delete="task" data-id="${esc(x.id)}">Izbriši</button></div></div>`).join(''):'<div class="empty"><div>🌼</div>Tu ni nalog. Poskusi drug filter ali dodaj novo nalogo.</div>'}</section></div>`}
function calendar(){const mode=state.calMode,cur=state.cursor,chosen=state.chosen,month=cur.slice(0,7),week=weekStart(cur),end=offset(week,6),sorted=[...data.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const monthBegin=month+'-01',monthstart=weekStart(monthBegin);const title=mode==='month'?nice(monthBegin,{month:'long',year:'numeric'}):mode==='week'?nice(week,{day:'numeric',month:'short'})+' – '+nice(end):nice(chosen,{weekday:'long',day:'numeric',month:'long'});
const byDay=d=>sorted.filter(x=>x.date===d);
let days='';if(mode==='month'){days=`<div class="calgrid">${['Pon','Tor','Sre','Čet','Pet','Sob','Ned'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{let d=offset(monthstart,i),events=byDay(d);return `<button class="day ${d===chosen?'selected':''} ${d===dateStr()?'today':''} ${d.slice(0,7)!==month?'outside':''}" data-choose="${d}" aria-label="${nice(d)}"><b>${dateObj(d).getDate()}</b><div class="dots">${events.slice(0,4).map(x=>`<i class="dot ${styleCat(x.category)}" title="${esc(x.title)}"></i>`).join('')}</div></button>`}).join('')}</div>`}else if(mode==='week'){days=`<div class="weekdays">${Array.from({length:7},(_,i)=>{const d=offset(week,i);return `<button class="day ${d===chosen?'selected':''}" data-choose="${d}"><small>${nice(d,{weekday:'short'})}</small><b style="font-size:22px">${dateObj(d).getDate()}</b>${byDay(d).slice(0,2).map(x=>`<span style="font-size:10px;overflow:hidden;text-overflow:ellipsis">• ${esc(x.title)}</span>`).join('')}</button>`}).join('')}</div>`}else{days=`<div class="stack">${byDay(chosen).length?byDay(chosen).map(x=>`<div class="taskrow"><b>${x.time}</b><span class="dot ${styleCat(x.category)}"></span><b>${esc(x.title)}</b></div>`).join(''):'<div class="empty"><div>🌼</div>Ta dan ni dogodkov.</div>'}</div>`}
const visible=sorted.filter(x=>mode==='day'?x.date===chosen:mode==='week'?x.date>=week&&x.date<=end:(state.showAll?x.date.startsWith(month):x.date===chosen));
return `<div class="stack"><div class="hero"><div><h2>Tvoj čas, tvoji lepi trenutki 🗓️</h2><p>Dogodki na enem mestu, brez hitenja.</p></div><button class="btn" data-add="event">＋ Nov dogodek</button></div><div class="grid2"><div class="panel"><div class="section-header"><h2>Koledar</h2><div class="tabs">${[['day','Dan'],['week','Teden'],['month','Mesec']].map(([k,n])=>`<button data-calmode="${k}" class="${mode===k?'active':''}">${n}</button>`).join('')}</div></div><div class="calendar-head"><strong>${title}</strong><div class="flex"><button class="ghost" data-jump="-1">‹</button><button class="ghost" data-jump="0">Danes</button><button class="ghost" data-jump="1">›</button></div></div>${days}<div class="flex wrap" style="margin-top:16px">${cats.map(c=>`<span class="sub"><i class="dot ${styleCat(c)}" style="display:inline-block"></i> ${c}</span>`).join('')}</div></div><div class="panel"><div class="section-header"><h2>Načrtovani dogodki</h2></div><p class="sub">${visible.length} dogodkov</p>${mode==='month'?`<button class="smallbutton" data-showall="1">${state.showAll?'Pokaži izbrani dan':'Pokaži ves mesec'} →</button>`:''}<div style="margin-top:15px">${visible.length?visible.map(x=>`<div class="listitem"><h3> ${esc(x.title)}</h3><p>🗓 ${nice(x.date)} · ${x.time}</p>${pill(x.category)}<div class="rowactions"><button class="smallbutton" data-edit="event" data-id="${esc(x.id)}">Uredi</button><button class="smallbutton danger" data-delete="event" data-id="${esc(x.id)}">Izbriši</button></div></div>`).join(''):'<div class="empty"><div>🌿</div>Ni dogodkov v izbranem obdobju.</div>'}</div><button class="ghost" style="width:100%;margin-top:12px" data-add="event">＋ Dodaj dogodek</button></div></div></div>`}
function goals(){const done=data.goals.filter(x=>x.completed).length,visible=data.goals.filter(x=>state.goalFilter==='all'||x.period===state.goalFilter);return `<div class="stack"><div class="hero"><div><div class="eyebrow">Sanjarjenje je dovoljeno ✨</div><h2>Velike sanje se začnejo z majhnim korakom.</h2><p>Postavi si cilj in spremljaj svoj napredek.</p></div><button class="btn" data-add="goal">＋ Nov cilj</button></div><div class="grid4">${stat('🌼',data.goals.length,'Vsi cilji')}${stat('🎉',done,'Doseženi cilji')}${stat('⭐',pct(done,data.goals.length)+'%','Delež doseženih ciljev')}</div><div class="panel"><div class="section-header"><h2>Moji osebni cilji</h2><div class="tabs">${[['all','Vsi'],['daily','Dnevni'],['weekly','Tedenski'],['monthly','Mesečni']].map(([k,n])=>`<button data-goalfilter="${k}" class="${state.goalFilter===k?'active':''}">${n}</button>`).join('')}</div></div><div class="grid2">${visible.length?visible.map(x=>{const p=pct(x.progress,x.target);return `<div class="listitem"><div class="flex between">${pill({'daily':'Dnevni','weekly':'Tedenski','monthly':'Mesečni'}[x.period])}<span>${x.completed?'🏆':'🌷'}</span></div><h3 style="margin-top:14px">${esc(x.title)}</h3><p>Rok: ${nice(x.deadline)}</p><div class="flex between" style="margin:20px 0 8px"><span class="sub">Napredek: ${x.progress}/${x.target}</span><b>${p}%</b></div>${progress(p)}<div class="flex between wrap" style="margin-top:17px"><div class="flex"><button class="ghost" data-gstep="-1" data-id="${esc(x.id)}" ${x.progress===0?'disabled':''}>−</button><button class="ghost" data-gstep="1" data-id="${esc(x.id)}" ${x.progress>=x.target?'disabled':''}>＋</button></div><button class="ghost" data-gcomplete="${esc(x.id)}">${x.completed?'✓ Doseženo':'✓ Označi doseženo'}</button></div><div class="rowactions"><button class="smallbutton" data-edit="goal" data-id="${esc(x.id)}">✎ Uredi</button><button class="smallbutton danger" data-delete="goal" data-id="${esc(x.id)}">Izbriši</button></div></div>`}).join(''):'<div class="empty"><div>🌱</div>Dodaj prvi cilj ali izberi drug filter.</div>'}</div></div></div>`}
function statistics(){const today=dateStr(),week=weekStart(today),days=Array.from({length:7},(_,i)=>offset(week,i)),complete=data.tasks.filter(x=>x.completed).length,weekTasks=data.tasks.filter(x=>days.includes(x.date)),weekDone=weekTasks.filter(x=>x.completed).length,doneGoals=data.goals.filter(x=>x.completed).length,max=Math.max(1,...days.map(d=>data.tasks.filter(t=>t.date===d).length));return `<div class="stack"><div class="grid4">${stat('✓',complete,'Opravljenih nalog')}${stat('☷',data.tasks.length-complete,'Neopravljenih nalog')}${stat('↗',pct(weekDone,weekTasks.length)+'%','Tedenska uspešnost')}${stat('◎',doneGoals+'/'+data.goals.length,'Doseženih ciljev')}</div><div class="grid2"><div class="panel"><div class="section-header"><h2>Tvoj teden v številkah</h2></div><p class="sub">Vijolična označuje dokončani del nalog.</p><div class="bars">${days.map(d=>{const arr=data.tasks.filter(t=>t.date===d),a=arr.filter(x=>x.completed).length;return `<div><span>${a}/${arr.length}</span><div class="bar" style="height:${Math.max(4,arr.length/max*140)}px"><i style="height:${pct(a,arr.length)}%"></i></div><b>${nice(d,{weekday:'short'})}</b></div>`}).join('')}</div></div><div class="panel"><div class="section-header"><h2>Napredek pri ciljih</h2></div>${data.goals.length?data.goals.map(x=>`<div style="margin:0 0 18px"><div class="flex between" style="font-size:13px;margin-bottom:7px"><b>${esc(x.title)}</b><b>${pct(x.progress,x.target)}%</b></div>${progress(pct(x.progress,x.target))}</div>`).join(''):'<div class="empty">Tukaj bodo prikazani tvoji cilji.</div>'}</div></div><div class="panel"><div class="section-header"><h2>Naloge po kategorijah</h2></div>${cats.map(c=>{const arr=data.tasks.filter(x=>x.category===c);return `<div style="margin:0 0 15px"><div class="flex between" style="margin-bottom:7px"><b style="font-size:13px">${c}</b><span class="sub">${arr.filter(x=>x.completed).length}/${arr.length}</span></div>${progress(pct(arr.filter(x=>x.completed).length,arr.length))}</div>`}).join('')}</div></div>`}
function settings(){return `<div class="stack" style="max-width:720px;margin:auto"><div class="panel"><h2>🔔 Nežni opomniki</h2><p class="sub" style="line-height:1.7">Opomniki se prikažejo znotraj aplikacije, dokler je odprta. Ne pošiljajo potisnih obvestil.</p><label class="setting" style="margin:20px 0"><span><b>Omogoči opomnike</b><br><small class="sub">Opozorila za dogodke in zamujene naloge</small></span><input type="checkbox" id="notifyToggle" ${data.settings.remindersEnabled?'checked':''}></label><b style="font-size:13px">Privzeti čas opomnika</b><div style="max-width:340px;margin-top:8px"><select class="select" id="notifyMinutes" ${!data.settings.remindersEnabled?'disabled':''}>${[0,5,10,15,30,60].map(n=>`<option value="${n}" ${n===data.settings.defaultReminderMinutes?'selected':''}>${n?n+' minut pred dogodkom':'Ob začetku dogodka'}</option>`).join('')}</select></div></div><div class="panel"><h2>Tvoji podatki</h2><p class="sub" style="line-height:1.7">Podatki so shranjeni lokalno v tem brskalniku. Med napravami se ne sinhronizirajo. Če izbrišeš podatke brskalnika, se lahko izbriše tudi tvoj načrt.</p><button class="ghost" data-reset="1">↺ Ponastavi na vzorčne podatke</button></div><div style="text-align:center;color:#938AA5;font-size:13px">Narejeno z mislijo na mirnejše dni. 🌸</div></div>`}
function render(){const namesMap={home:'Lep dan za nov začetek! ☀️',tasks:'Moje naloge',calendar:'Koledar',goals:'Moji cilji',stats:'Statistika',settings:'Nastavitve'},content={home:dashboard,tasks,calendar,goals,stats:statistics,settings};$('app').innerHTML=`<aside><div class="logo"><span class="flower">🌸</span><div><strong>Moj Ritem</strong><small>Tvoj dan, tvoj tempo</small></div></div><div class="nav">${navKeys.map((k,i)=>`<button data-page="${k}" class="${state.page===k?'active':''}">${navIcons[i]} &nbsp;${names[i]}</button>`).join('')}</div><div class="sidebar-note">✨<br><b>Majhni koraki štejejo.</b><br>Vsak dan je nova priložnost, da ujameš svoj ritem.</div></aside><div class="mainwrap"><main><header><div><div class="eyebrow">Moj mali svet organizacije</div><h1>${namesMap[state.page]}</h1><p>${state.page==='home'?'Vzemi si trenutek in poglej, kaj te danes čaka.':'Vse, kar potrebuješ, na enem mirnem mestu.'}</p></div><div class="date">🗓️ ${nice(dateStr(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></header>${content[state.page]()}</main></div>`;renderModal();}
function blank(type){if(type==='task')return{id:'',title:'',description:'',date:dateStr(),time:'12:00',category:'Osebno',important:false,completed:false};if(type==='event')return{id:'',title:'',date:state.chosen,time:'12:00',category:'Osebno',reminderMinutesBefore:null};return{id:'',title:'',period:'weekly',deadline:offset(dateStr(),7),target:5,progress:0,completed:false}}
const input=(label,name,type,value,attr='')=>`<div><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attr} required></div>`;
function renderModal(){const el=$('dialog'),obj=state.dialog;if(!obj){el.innerHTML='';return}const{type,draft:x}=obj;let fields='';
if(type==='task')fields=`${input('Naslov naloge *','title','text',x.title,'maxlength="100"') }<div><label for="f-description">Opis</label><textarea name="description" id="f-description" maxlength="500">${esc(x.description)}</textarea></div><div class="two">${input('Datum *','date','date',x.date)}${input('Ura *','time','time',x.time)}</div><div><label for="f-category">Kategorija</label><select id="f-category" name="category">${cats.map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><label class="flex" style="gap:10px"><input type="checkbox" name="important" ${x.important?'checked':''}> ⭐ Pomembna naloga</label>`;
if(type==='event')fields=`${input('Naslov dogodka *','title','text',x.title,'maxlength="100"')}<div class="two">${input('Datum *','date','date',x.date)}${input('Ura *','time','time',x.time)}</div><div><label for="f-category">Kategorija</label><select id="f-category" name="category">${cats.map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="f-reminder">Opomnik</label><select id="f-reminder" name="reminder">${[-1,0,5,10,15,30,60].map(n=>`<option value="${n}" ${(x.reminderMinutesBefore??-1)===n?'selected':''}>${n===-1?'Privzeta nastavitev':n===0?'Ob začetku dogodka':n+' minut prej'}</option>`).join('')}</select></div>`;
if(type==='goal')fields=`${input('Moj cilj *','title','text',x.title,'maxlength="100"')}<div><label for="f-period">Obdobje</label><select id="f-period" name="period">${[['daily','Dnevni'],['weekly','Tedenski'],['monthly','Mesečni']].map(([k,v])=>`<option value="${k}" ${x.period===k?'selected':''}>${v}</option>`).join('')}</select></div>${input('Rok *','deadline','date',x.deadline)}<div class="two">${input('Ciljna vrednost *','target','number',x.target,'min="1" max="100000" step="1"')}${input('Trenutni napredek *','progress','number',x.progress,'min="0" max="100000" step="1"')}</div>`;
const text={task:'nalogo',event:'dogodek',goal:'cilj'}[type];el.innerHTML=`<div class="modalwrap" data-close="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="section-header"><h2 id="modal-title">${x.id?'Uredi':'Dodaj'} ${text}</h2><button class="ghost" data-close="1" aria-label="Zapri">✕</button></div><form id="entityForm" class="form">${fields}<div class="flex wrap" style="margin-top:5px"><button type="submit" class="btn">${x.id?'Shrani spremembe':'Dodaj'}</button><button type="button" class="ghost" data-close="1">Prekliči</button></div></form></div></div>`}
function submitForm(form){const {type,draft}=state.dialog,f=new FormData(form),title=String(f.get('title')||'').trim();if(!title)return;const next={...draft,title,id:draft.id||id()};if(type==='task'){Object.assign(next,{description:String(f.get('description')||'').trim(),date:String(f.get('date')),time:String(f.get('time')),category:String(f.get('category')),important:!!f.get('important')})}if(type==='event'){const n=Number(f.get('reminder'));Object.assign(next,{date:String(f.get('date')),time:String(f.get('time')),category:String(f.get('category')),reminderMinutesBefore:n===-1?null:n});state.chosen=next.date;state.cursor=next.date}if(type==='goal'){const target=Math.max(1,Math.floor(Number(f.get('target'))));const value=Math.min(target,Math.max(0,Math.floor(Number(f.get('progress')))));Object.assign(next,{period:String(f.get('period')),deadline:String(f.get('deadline')),target,progress:value,completed:value>=target})}const collection={task:'tasks',event:'events',goal:'goals'}[type];const arr=data[collection],i=arr.findIndex(v=>v.id===next.id);if(i>=0)arr[i]=next;else arr.push(next);state.dialog=null;save();render()}
function reminderCheck(){if(!data.settings.remindersEnabled)return;const now=Date.now();for(const event of data.events){const starts=timeValue(event.date,event.time),before=(event.reminderMinutesBefore??data.settings.defaultReminderMinutes)*60000,noticeID='e'+event.id+starts;if(now>=starts-before&&now<=starts&&!noticed.has(noticeID)){noticed.add(noticeID);state.alert=`🔔 Kmalu: ${event.title} (${event.time})`;break;}}const due=data.tasks.filter(x=>!x.completed&&timeValue(x.date,x.time)<now);const noticeID='late'+dateStr();if(!state.alert&&due.length&&!noticed.has(noticeID)){noticed.add(noticeID);state.alert=`🌷 ${due.length} nedokončanih nalog čaka nate.`}renderAlert()}
function renderAlert(){const el=$('alerts');el.innerHTML=state.alert?`<div class="notice"><b style="flex:1">${esc(state.alert)}</b><button data-dismiss="1" aria-label="Zapri">✕</button></div>`:''}
window.addEventListener('click',e=>{const target=e.target.closest('button,[data-page],a,[data-close]');if(!target)return;const a=target.dataset;if(a.page){changePage(a.page);return}if(a.add){state.dialog={type:a.add,draft:blank(a.add)};renderModal();return}if(a.edit){const collection={task:'tasks',event:'events',goal:'goals'}[a.edit],x=data[collection].find(y=>y.id===a.id);if(x){state.dialog={type:a.edit,draft:{...x}};renderModal()}return}if(a.delete){const collection={task:'tasks',event:'events',goal:'goals'}[a.delete],list=data[collection],x=list.find(y=>y.id===a.id);if(x&&confirm(`Ali želiš izbrisati »${x.title}«?`)){data[collection]=list.filter(y=>y.id!==a.id);save();render()}return}if(a.filter){state.filter=a.filter;render();return}if(a.goalfilter){state.goalFilter=a.goalfilter;render();return}if(a.calmode){state.calMode=a.calmode;state.cursor=state.chosen;state.showAll=false;render();return}if(a.choose){state.chosen=a.choose;state.cursor=a.choose;state.showAll=false;render();return}if(a.jump!==undefined){const n=Number(a.jump);const next=n===0?dateStr():state.calMode==='month'?monOffset(state.cursor,n):offset(state.cursor,n*(state.calMode==='week'?7:1));state.cursor=next;state.chosen=next;state.showAll=false;render();return}if(a.showall){state.showAll=!state.showAll;render();return}if(a.gstep){const x=data.goals.find(x=>x.id===a.id);if(x){x.progress=Math.max(0,Math.min(x.target,x.progress+Number(a.gstep)));x.completed=x.progress>=x.target;save();render()}return}if(a.gcomplete){const x=data.goals.find(x=>x.id===a.gcomplete);if(x){x.progress=x.completed?Math.max(0,x.target-1):x.target;x.completed=!x.completed;save();render()}return}if(a.close){state.dialog=null;renderModal();return}if(a.reset){if(confirm('Izbrišem vse tvoje podatke in znova naložim primere?')){data=seed();save();state.page='home';noticed.clear();state.alert=null;render();renderAlert()}return}if(a.dismiss){state.alert=null;renderAlert();return}});
document.addEventListener('mousedown',e=>{if(e.target.classList.contains('modalwrap')){state.dialog=null;renderModal()}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.check){const t=data.tasks.find(t=>t.id===x.dataset.check);if(t){t.completed=x.checked;save();render()}return}if(x.id==='categoryFilter'){state.category=x.value;render();return}if(x.id==='notifyToggle'){data.settings.remindersEnabled=x.checked;save();render();return}if(x.id==='notifyMinutes'){data.settings.defaultReminderMinutes=Number(x.value);save();render();return}});
document.addEventListener('submit',e=>{if(e.target.id==='entityForm'){e.preventDefault();submitForm(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.dialog){state.dialog=null;renderModal()}});
render();reminderCheck();setInterval(reminderCheck,30000);
})();
</script>
</body></html>
