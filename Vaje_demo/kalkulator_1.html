<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statični kalkulator 1</title>
  <link rel="stylesheet" href="kalkulator_1.css">
</head>
<body>
  <main class="kalkulator" aria-label="Statična slika kalkulatorja">
    <div class="zaslon">
      <div class="izraz">25.75 +</div>
      <div class="rezultat">65.25</div>
    </div>

    <div class="tipkovnica">
      <div class="tipka sirina-2">AC</div>
      <div class="tipka">DEL</div>
      <div class="tipka">÷</div>

      <div class="tipka">1</div>
      <div class="tipka">2</div>
      <div class="tipka">3</div>
      <div class="tipka">*</div>

      <div class="tipka">4</div>
      <div class="tipka">5</div>
      <div class="tipka">6</div>
      <div class="tipka">+</div>

      <div class="tipka">7</div>
      <div class="tipka">8</div>
      <div class="tipka">9</div>
      <div class="tipka">-</div>

      <div class="tipka">.</div>
      <div class="tipka">0</div>
      <div class="tipka enako sirina-2">=</div>
    </div>
  </main>
</body>
</html>
